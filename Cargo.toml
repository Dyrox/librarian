[package]
name = "librarian"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
flate2 = "1.1.11"
iced = { version = "0.14", features = ["svg", "canvas", "tokio", "advanced", "image"] }
notify = "8"
quick-xml = "0.42.0"
rayon = "1.12.0"
rfd = "0.18.0"
rodio = "0.23"
symphonia = { version = "0.5", features = ["mp3", "wav", "pcm", "flac"] }
sys-locale = "0.3"
unicode-normalization = "0.1.26"

[profile.release]
# Thin LTO keeps most of the size/speed win but builds in parallel, so CI is much faster.
lto = "thin"
panic = "abort"
strip = true
opt-level = 3

# Dragging a bounce out of the window as a file (Linux would need GTK).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString"] }

[build-dependencies]
winresource = "0.1.34"
