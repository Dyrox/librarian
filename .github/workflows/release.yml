# Every push to main builds Librarian for Windows, macOS and Linux and
# publishes the packages as a GitHub Release tagged v<major>.<minor>.<run>.
# Major/minor come from Cargo.toml (bump them there); the patch number is the
# workflow run number, so every build gets a new, increasing version. Each job
# works the version out itself, so all three platforms start at once.
# Pull requests only build (no release).

name: Build & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version: $base.${{ github.run_number }}"
      - name: Stamp version
        shell: bash
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
      - name: Build
        run: cargo build --release
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "Librarian-$env:VERSION-windows-x64-portable"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force "$dir/LibrarianData" | Out-Null
          Copy-Item target/release/librarian.exe "$dir/Librarian.exe"
          Set-Content "$dir/LibrarianData/README.txt" @"
          Portable mode: Librarian keeps its settings, tags and caches in this folder,
          next to Librarian.exe, so you can carry it on a USB drive.
          Delete this folder to store them in your user profile instead.
          "@
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
      - name: Installer
        shell: pwsh
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "$inno\ISCC.exe" "/DAppVersion=$($env:VERSION)" packaging\windows\librarian.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version: $base.${{ github.run_number }}"
      - name: Stamp version
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
      - name: Build universal app + DMG
        run: UNIVERSAL=1 DMG=1 ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    # Older Ubuntu = older glibc, so the binary runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version: $base.${{ github.run_number }}"
      - name: Stamp version
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
      - name: Build
        run: cargo build --release
      - name: Package (.deb + .tar.gz)
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # history and tags, for the changelog
      - name: Version
        shell: bash
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version: $base.${{ github.run_number }}"
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      # Changelog: every commit since the previous release, then the download table.
      - name: Release notes
        run: |
          python3 scripts/release-notes.py "$VERSION" > notes.md
          cat >> notes.md <<'NOTES'
          ## Downloads

          | Platform | Download |
          | --- | --- |
          | Windows (installer) | `Librarian-__VERSION__-windows-x64-setup.exe` |
          | Windows (portable) | `Librarian-__VERSION__-windows-x64-portable.zip` — unzip and run `Librarian.exe`; settings stay in the `LibrarianData` folder next to it |
          | macOS (Apple Silicon + Intel) | `Librarian-__VERSION__-macos-universal.dmg` |
          | Linux (Debian / Ubuntu) | `librarian___VERSION___amd64.deb` |
          | Linux (any distro) | `Librarian-__VERSION__-linux-x86_64.tar.gz` |

          The builds aren't signed by Apple or Microsoft yet. On macOS, the first time: right-click Librarian → Open (or System Settings → Privacy & Security → Open Anyway). On Windows, SmartScreen may ask: More info → Run anyway.
          NOTES
          sed -i "s/__VERSION__/$VERSION/g" notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Librarian ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
          body_path: notes.md
